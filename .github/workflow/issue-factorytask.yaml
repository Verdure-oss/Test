  name: ai-factory issue

  on:
    issues:
      types: [labeled, reopened]

  jobs:
    run:
      if: >
        contains(github.event.issue.labels.*.name, 'ai-factory') &&
        contains(github.event.issue.labels.*.name, 'ai-factory-run') &&
        (github.event.action != 'labeled' || github.event.label.name == 'ai-factory-run')
      uses: liyuerich/ai-factory/.github/workflows/ai-factory-issue-reusable.yaml@main
      with:
        repository: ${{ github.repository }}
        issue_number: ${{ github.event.issue.number }}
      secrets:
        AI_FACTORY_OPENAI_API_KEY: ${{ secrets.AI_FACTORY_OPENAI_API_KEY }}
        AI_FACTORY_GITHUB_TOKEN: ${{ secrets.AI_FACTORY_GITHUB_TOKEN }}